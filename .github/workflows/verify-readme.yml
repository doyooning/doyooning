name: Verify README display
on:
  push:
    branches: [main]
    paths: ['README.md', 'assets/**', 'scripts/verify-readme.mjs', '.github/workflows/verify-readme.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Update profile stats']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: readme-display
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser verifier
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify uploaded README and public profile
        run: |
          VERIFY_SHA=$(git rev-parse HEAD) node scripts/verify-readme.mjs
      - name: Add result to run summary
        if: always()
        run: |
          if [ -f verification-results/summary.md ]; then
            cat verification-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-display-results
          path: verification-results/
          if-no-files-found: warn
          retention-days: 14
