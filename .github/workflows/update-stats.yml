name: Update profile stats
on:
  schedule:
    - cron: '23 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/generate-stats.mjs', '.github/workflows/update-stats.yml']
permissions:
  contents: write
concurrency:
  group: profile-stats-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate cards from GitHub public data
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: node scripts/generate-stats.mjs
      - name: Commit generated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh profile stats'
          git pull --rebase origin main
          git push origin HEAD:main
